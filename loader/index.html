<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Loading…</title>
  <style>
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #0b0d12;
      color: #c8cdda;
      font-family: -apple-system, system-ui, sans-serif;
      flex-direction: column;
      gap: 16px;
    }
    .spinner {
      width: 28px;
      height: 28px;
      border: 2px solid rgba(110,231,255,0.2);
      border-top-color: #6ee7ff;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    .msg { font-size: 14px; color: #8a93a8; }
    .err { color: #ff6b81; font-size: 13px; max-width: 480px; text-align: center; padding: 0 16px; line-height: 1.5; }
    a { color: #6ee7ff; }
  </style>
</head>
<body>
  <div class="spinner" id="spinner"></div>
  <div class="msg" id="msg">Loading Shoolwork Proxy…</div>

  <script>
    // ============================================================
    // CONFIG — EDIT THESE THREE LINES
    // ============================================================
    const GITHUB_REPO = 'Hatti-Enterprises/shoolwork-proxy';
    const BRANCH = 'main';
    const BACKEND_URL = 'https://shoolwork-proxy-backend.vercel.app';
    // ============================================================

    const JSDELIVR_BASE = `https://cdn.jsdelivr.net/gh/${GITHUB_REPO}@${BRANCH}/frontend/`;
    const JSDELIVR_INDEX = JSDELIVR_BASE + 'index.html';
    const fetchUrl = JSDELIVR_INDEX + '?t=' + Date.now();

    fetch(fetchUrl, { cache: 'no-store' })
      .then(res => {
        if (!res.ok) throw new Error(`HTTP ${res.status} — check that ${GITHUB_REPO} is public`);
        return res.text();
      })
      .then(html => {
        const baseTag = '<base href="' + JSDELIVR_BASE + '">';
        // Split closing script tag to avoid breaking HTML parser
        const backendScript = '<scr' + 'ipt>window.SHoolworkBackendUrl = "' + BACKEND_URL + '";</scr' + 'ipt>';
        const modifiedHtml = html.replace('<head>', '<head>' + baseTag + backendScript);

        document.open();
        document.write(modifiedHtml);
        document.close();
      })
      .catch(err => {
        document.getElementById('spinner').style.display = 'none';
        document.getElementById('msg').textContent = 'Failed to load';
        const errDiv = document.createElement('div');
        errDiv.className = 'err';
        errDiv.innerHTML = escapeHtml(err.message) + '<br><br>Check that:<br>- GITHUB_REPO is set correctly<br>- Your GitHub repo is public<br>- frontend/index.html exists on branch ' + BRANCH + '<br><br>jsDelivr URL: <a href="' + JSDELIVR_INDEX + '" target="_blank">' + JSDELIVR_INDEX + '</a>';
        document.body.appendChild(errDiv);
      });

    function escapeHtml(s) {
      return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'})[c]);
    }
  </script>
</body>
</html>
