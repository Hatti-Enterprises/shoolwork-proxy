  <!-- UV bootstrap. Bundle must load BEFORE config (config reads Ultraviolet global). -->
  <script src="https://cdn.jsdelivr.net/npm/@titaniumnetwork-dev/ultraviolet@3.2.10/dist/uv.bundle.js"></script>
  <script>
    // Inline UV config — page-side. Sets window.uv for app.js to call
    // uv.encodeUrl() and uv.prefix. The SW has its own copy of this config.
    //
    // The UV prefix is RELATIVE to this page's own URL — computed at runtime
    // so the proxy works on any host (jsDelivr loader, GitHub Pages, Netlify,
    // Cloudflare Pages, custom domain, etc.) without code changes.
    //
    // BACKEND_URL must match what's set in sw.js. Default: same-origin.
    window.SHoolworkBackendUrl = window.SHoolworkBackendUrl || '';  // ← set this to your backend URL, e.g. 'https://your-backend.vercel.app'

    // Compute the UV prefix relative to this page's directory.
    // Example: page at https://example.com/foo/index.html → prefix is
    //          https://example.com/foo/service/
    // The SW (registered at ./sw.js) has the same scope dir + 'service/'.
    const PAGE_DIR = location.href.replace(/[^/]*$/, '');
    const UV_PREFIX = PAGE_DIR + 'service/';

    self.__uv = self.__uv || {};
    self.__uv.config = {
      prefix: UV_PREFIX,
      bare: (window.SHoolworkBackendUrl || location.origin).replace(/\/+$/, '') + '/api/bare/',
      encodeUrl: Ultraviolet.codec.xor.encode,
      decodeUrl: Ultraviolet.codec.xor.decode,
    };
    self.__uv$bare = self.__uv.config.bare;
    window.uv = {
      prefix: self.__uv.config.prefix,
      bare: self.__uv.config.bare,
      encodeUrl: (url) => Ultraviolet.codec.xor.encode(url),
      decodeUrl: (encoded) => Ultraviolet.codec.xor.decode(encoded),
    };
  </script>
  <!-- INLINE_SCRIPT -->
  <script type="module">
    /* Embed-mode detection — if the page is loaded inside an iframe
     * (window.self !== window.top) OR with ?embed=1, switch the top
     * chrome to a more compact layout that fits inside a parent page.
     */
    const params = new URLSearchParams(location.search);
    const isEmbed = params.get('embed') === '1' || window.self !== window.top;
    if (isEmbed) {
      document.body.classList.add('embed-mode');
      const proxyBtn = document.querySelector('.chrome__nav-btn[data-view="proxy"]');
      if (proxyBtn) proxyBtn.click();
      const initialUrl = params.get('url');
      if (initialUrl) {
        const input = document.getElementById('addressInput');
        if (input) input.value = initialUrl;
        setTimeout(() => {
          if (window.__shoolworkApp) window.__shoolworkApp.openInProxy(initialUrl);
        }, 500);
      }
      window.parent?.postMessage({ type: 'shoolwork:ready' }, '*');
    }
  </script>
